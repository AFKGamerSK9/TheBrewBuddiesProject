<div class="modal-overlay" id="reviewModal">
  <div class="modal-card">
    <button class="modal-close" onclick="closeReviewModal()">✕</button>
    <div class="modal-title">Write a Review</div>

    <div class="product-summary">
      <img
        src="https://images.unsplash.com/photo-1587734195503-904fca47e0e9?auto=format&fit=crop&w=100&q=80"
        alt="Coffee"
      />
      <div>
        <div class="p-title">Ethiopian Yirgacheffe</div>
        <div class="p-meta">250g, Whole Bean</div>
      </div>
    </div>

    <form id="reviewForm" onsubmit="submitReview(event)">
      <div class="modal-group">
        <label>Overall Rating</label>
        <div class="star-rating" id="starRating">
          <span onclick="setRating(1)">★</span>
          <span onclick="setRating(2)">★</span>
          <span onclick="setRating(3)">★</span>
          <span onclick="setRating(4)">★</span>
          <span onclick="setRating(5)">★</span>
          <span class="rating-label" id="ratingLabel">5/5 Excellent</span>
        </div>
      </div>

      <div class="modal-group">
        <label>Review Title</label>
        <input
          type="text"
          id="reviewTitle"
          class="modal-input"
          placeholder="e.g., Best morning brew in Kathmandu!"
          required
        />
      </div>

      <div class="modal-group">
        <label>Your Review</label>
        <textarea
          id="reviewText"
          class="modal-textarea"
          placeholder="How was the flavor profile, aroma, and roast quality?"
          required
        ></textarea>
      </div>

      <div class="modal-group">
        <label>Add Photos (Optional)</label>
        <div class="dropzone">
          <div class="dropzone-icon">📷</div>
          <div>Drag & drop or click to upload</div>
        </div>
      </div>

      <div class="modal-group">
        <label>Would you recommend this brew?</label>
        <div class="radio-row">
          <label
            ><input type="radio" name="recommend" value="yes" checked /> 🟢
            Yes</label
          >
          <label
            ><input type="radio" name="recommend" value="no" /> ⚪ No</label
          >
        </div>
      </div>

      <div class="form-grid-2">
        <div class="modal-group">
          <label>Name</label>
          <input
            type="text"
            id="reviewerName"
            class="modal-input"
            placeholder="Your Name"
            required
          />
        </div>
        <div class="modal-group">
          <label>Email Address</label>
          <input
            type="email"
            id="reviewerEmail"
            class="modal-input"
            placeholder="you@example.com"
            required
          />
        </div>
      </div>

      <button type="submit" class="btn-submit-review">Submit Review</button>
    </form>
  </div>
</div>
