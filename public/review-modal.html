<style>
  .modal-overlay {
    display: flex;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(3px);
    justify-content: center;
    align-items: center;
    z-index: 9999;
  }

  .modal-card {
    background: #ffffff;
    width: 440px;
    max-width: 90vw;
    border-radius: 16px;
    padding: 24px;
    position: relative;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
    font-family:
      "Segoe UI",
      system-ui,
      -apple-system,
      sans-serif;
    color: #2c2623;
  }

  .modal-close {
    position: absolute;
    top: 20px;
    right: 20px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #f4eee7;
    border: none;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #555;
  }

  .modal-title {
    font-size: 18px;
    font-weight: 700;
    color: #2c2623;
    margin-bottom: 16px;
  }

  .product-summary {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #f8f4ef;
    padding: 10px 14px;
    border-radius: 10px;
    margin-bottom: 20px;
  }

  .product-summary img {
    width: 44px;
    height: 44px;
    border-radius: 8px;
    object-fit: cover;
  }

  .product-summary .p-title {
    font-size: 13px;
    font-weight: 700;
    color: #2c2623;
  }

  .product-summary .p-meta {
    font-size: 11px;
    color: #8a847c;
    margin-top: 2px;
  }

  .divider-dashed {
    border: none;
    border-top: 1px dashed #d1c9be;
    margin: 20px 0;
  }

  .modal-group {
    margin-bottom: 16px;
  }

  .modal-group label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: #2c2623;
    margin-bottom: 6px;
  }

  .modal-input,
  .modal-textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #e2ddd5;
    border-radius: 8px;
    font-size: 12px;
    background: #ffffff;
    color: #2c2623;
    outline: none;
  }

  .modal-input::placeholder,
  .modal-textarea::placeholder {
    color: #b0a99f;
  }

  .modal-input:focus,
  .modal-textarea:focus {
    border-color: #1d7a46;
  }

  .modal-textarea {
    height: 75px;
    resize: none;
  }

  .star-rating {
    display: flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
  }

  .star-rating .star {
    font-size: 18px;
    color: #e0d8cd;
    transition: color 0.15s ease;
  }

  .star-rating .star.active {
    color: #f3a812;
  }

  .rating-label {
    font-size: 12px;
    font-weight: 600;
    color: #1d7a46;
    margin-left: 8px;
  }

  .dropzone {
    border: 1px dashed #cfc7bc;
    background: #f8f4ef;
    border-radius: 10px;
    padding: 16px;
    text-align: center;
    cursor: pointer;
  }

  .dropzone-icon {
    font-size: 16px;
    color: #7a746e;
    margin-bottom: 4px;
  }

  .dropzone-text {
    font-size: 11px;
    color: #7a746e;
  }

  .radio-row {
    display: flex;
    gap: 20px;
    font-size: 12px;
    color: #2c2623;
  }

  .radio-row label {
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }

  .radio-row input[type="radio"] {
    accent-color: #1d7a46;
    width: 14px;
    height: 14px;
  }

  .form-grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .btn-submit-review {
    width: 100%;
    background-color: #1d7a46;
    color: #ffffff;
    border: none;
    padding: 12px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  .btn-submit-review:hover {
    background-color: #155c34;
  }
</style>

<div class="modal-overlay" id="reviewModal">
  <div class="modal-card">
    <button type="button" class="modal-close" onclick="closeReviewModal()">
      ✕
    </button>
    <div class="modal-title">Write a Review</div>

    <div class="product-summary">
      <img
        src="https://images.unsplash.com/photo-1587734195503-904fca47e0e9?auto=format&fit=crop&w=120&q=80"
        alt="Ethiopian Yirgacheffe"
      />
      <div>
        <div class="p-title">Ethiopian Yirgacheffe</div>
        <div class="p-meta">250g, Whole Bean</div>
      </div>
    </div>

    <form id="reviewForm" onsubmit="submitReview(event)">
      <div class="modal-group">
        <label>Overall Rating</label>
        <div class="star-rating" id="starRating">
          <span class="star active" onclick="setRating(1)">★</span>
          <span class="star active" onclick="setRating(2)">★</span>
          <span class="star active" onclick="setRating(3)">★</span>
          <span class="star active" onclick="setRating(4)">★</span>
          <span class="star active" onclick="setRating(5)">★</span>
          <span class="rating-label" id="ratingLabel">5/5 Excellent</span>
        </div>
      </div>

      <div class="modal-group">
        <label for="reviewTitle">Review Title</label>
        <input
          type="text"
          id="reviewTitle"
          class="modal-input"
          placeholder="e.g., Best morning brew in Kathmandu!"
          required
        />
      </div>

      <div class="modal-group">
        <label for="reviewText">Your Review</label>
        <textarea
          id="reviewText"
          class="modal-textarea"
          placeholder="How was the flavor profile, aroma, and roast quality?"
          required
        ></textarea>
      </div>

      <div class="modal-group">
        <label>Add Photos (Optional)</label>
        <div
          class="dropzone"
          onclick="document.getElementById('photoInput').click()"
        >
          <div class="dropzone-icon">📷</div>
          <div class="dropzone-text">Drag & drop or click to upload</div>
          <input
            type="file"
            id="photoInput"
            accept="image/*"
            multiple
            style="display: none"
          />
        </div>
      </div>

      <div class="modal-group">
        <label>Would you recommend this brew?</label>
        <div class="radio-row">
          <label>
            <input type="radio" name="recommend" value="yes" checked /> Yes
          </label>
          <label> <input type="radio" name="recommend" value="no" /> No </label>
        </div>
      </div>

      <div class="form-grid-2">
        <div class="modal-group">
          <label for="reviewerName">Name</label>
          <input
            type="text"
            id="reviewerName"
            class="modal-input"
            placeholder="Your Name"
            required
          />
        </div>
        <div class="modal-group">
          <label for="reviewerEmail">Email Address</label>
          <input
            type="email"
            id="reviewerEmail"
            class="modal-input"
            placeholder="you@example.com"
            required
          />
        </div>
      </div>

      <hr class="divider-dashed" />

      <button type="submit" class="btn-submit-review">Submit Review</button>
    </form>
  </div>
</div>
